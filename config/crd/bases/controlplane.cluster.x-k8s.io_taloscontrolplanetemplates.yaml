---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: taloscontrolplanetemplates.controlplane.cluster.x-k8s.io
spec:
  group: controlplane.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: TalosControlPlaneTemplate
    listKind: TalosControlPlaneTemplateList
    plural: taloscontrolplanetemplates
    shortNames:
    - tcpt
    singular: taloscontrolplanetemplate
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: TalosControlPlaneTemplate is the Schema for the taloscontrolplanetemplates
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TalosControlPlaneTemplateSpec defines the desired state of
              TalosControlPlaneTemplate.
            properties:
              template:
                description: TalosControlPlaneTemplateResource describes the data
                  needed to create a TalosControlPlane from a template.
                properties:
                  metadata:
                    description: |-
                      Standard object's metadata.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/metadata/
                    minProperties: 1
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        description: |-
                          annotations is an unstructured key value map stored with a resource that may be
                          set by external tools to store and retrieve arbitrary metadata. They are not
                          queryable and should be preserved when modifying objects.
                          More info: http://kubernetes.io/docs/user-guide/annotations
                        type: object
                      labels:
                        additionalProperties:
                          type: string
                        description: |-
                          labels is a map of string keys and values that can be used to organize and categorize
                          (scope and select) objects. May match selectors of replication controllers
                          and services.
                          More info: http://kubernetes.io/docs/user-guide/labels
                        type: object
                    type: object
                  spec:
                    description: TalosControlPlaneTemplateResourceSpec defines the
                      desired state of TalosControlPlane through a template.
                    properties:
                      controlPlaneConfig:
                        description: |-
                          ControlPlaneConfig is a two TalosConfigSpecs
                          to use for initializing and joining machines to the control plane.
                        properties:
                          controlplane:
                            description: TalosConfigSpec defines the desired state
                              of TalosConfig
                            properties:
                              configPatches:
                                description: RFC6902 JSON patches to apply to machine
                                  configuration.
                                items:
                                  properties:
                                    op:
                                      type: string
                                    path:
                                      type: string
                                    value:
                                      x-kubernetes-preserve-unknown-fields: true
                                  required:
                                  - op
                                  - path
                                  type: object
                                type: array
                              data:
                                description: Machine configuration in case generateType=none.
                                type: string
                              generateType:
                                description: |-
                                  Talos machine configuration type to generate: Supported values are:
                                  controlplane, worker, init (deprecated), none (configuration must be then provided in data field).
                                enum:
                                - controlplane
                                - worker
                                - init
                                - none
                                type: string
                              hostname:
                                description: Set hostname in the machine configuration
                                  to some value.
                                properties:
                                  source:
                                    description: |-
                                      Source of the hostname.

                                      Allowed values:
                                      "MachineName" (use linked Machine's Name).
                                      "InfrastructureName" (use linked Machine's infrastructure's name).
                                    type: string
                                type: object
                              imageFactory:
                                description: |-
                                  ImageFactory declares the Talos Image Factory schematic the machine installs and
                                  upgrades with. When set, CABPT registers the schematic with the Factory and renders
                                  machine.install.image as <factory>/metal-installer/<schematic>:<version>.
                                properties:
                                  bootloader:
                                    description: Bootloader selects the bootloader
                                      of the disk image; the Factory default when
                                      empty.
                                    enum:
                                    - auto
                                    - dual-boot
                                    - grub
                                    - sd-boot
                                    type: string
                                  extensions:
                                    description: |-
                                      Extensions are official system extension names, e.g. siderolabs/nvme-cli. The
                                      Factory picks the extension versions matching the Talos version.
                                    items:
                                      type: string
                                    type: array
                                  extraKernelArgs:
                                    description: ExtraKernelArgs are baked into the
                                      images the Factory builds from the schematic.
                                    items:
                                      type: string
                                    type: array
                                  overlay:
                                    description: Overlay selects a single-board-computer
                                      overlay.
                                    properties:
                                      image:
                                        description: Image is the overlay container
                                          image, e.g. ghcr.io/siderolabs/sbc-raspberrypi.
                                        minLength: 1
                                        type: string
                                      name:
                                        description: Name is the overlay name, e.g.
                                          rpi_generic.
                                        minLength: 1
                                        type: string
                                    required:
                                    - image
                                    - name
                                    type: object
                                type: object
                              strategicPatches:
                                description: Talos Linux machine configuration strategic
                                  merge patch list.
                                items:
                                  type: string
                                type: array
                              talosVersion:
                                description: |-
                                  Version of Talos to generate machine configuration for, i.e. v1.0 (patch version may be omitted).
                                  Defaults to the latest supported version if unspecified.
                                  It is recommended to set this field explicitly to avoid unexpected issues during provider upgrades.
                                type: string
                            required:
                            - generateType
                            type: object
                        required:
                        - controlplane
                        type: object
                      machineNamingStrategy:
                        description: |-
                          MachineNamingStrategy allows changing the naming pattern used when creating control plane Machines.
                          InfraMachines and bootstrap configs use the same name as the corresponding Machine.
                        properties:
                          template:
                            description: |-
                              Template defines the template to use for generating the names of control plane Machine objects.
                              If not defined, it falls back to `{{ .talosControlPlane.name }}-{{ .random }}`.
                              If the generated name string exceeds 63 characters, it is trimmed to 58 characters and
                              concatenated with a random suffix of length 5.
                              The template allows the following variables:
                              * `.cluster.name`: the Cluster name.
                              * `.talosControlPlane.name`: the TalosControlPlane name.
                              * `.random`: a random alphanumeric string without vowels of length 5.
                            maxLength: 256
                            minLength: 1
                            type: string
                        type: object
                      machineTemplate:
                        description: |-
                          MachineTemplate contains information about how control plane Machines should be shaped.
                          For ClusterClass / topology, ClusterClass.spec.controlPlane.machineInfrastructure.templateRef
                          populates machineTemplate.spec.infrastructureRef when creating a concrete TalosControlPlane.
                          The template variant intentionally omits infrastructureRef and readinessGates: those fields
                          are owned by the topology controller (infrastructureRef) or by individual TalosControlPlane
                          instances (readinessGates).
                        properties:
                          metadata:
                            description: ObjectMeta is the standard object's metadata.
                            minProperties: 1
                            properties:
                              annotations:
                                additionalProperties:
                                  type: string
                                description: |-
                                  annotations is an unstructured key value map stored with a resource that may be
                                  set by external tools to store and retrieve arbitrary metadata. They are not
                                  queryable and should be preserved when modifying objects.
                                  More info: http://kubernetes.io/docs/user-guide/annotations
                                type: object
                              labels:
                                additionalProperties:
                                  type: string
                                description: |-
                                  labels is a map of string keys and values that can be used to organize and categorize
                                  (scope and select) objects. May match selectors of replication controllers
                                  and services.
                                  More info: http://kubernetes.io/docs/user-guide/labels
                                type: object
                            type: object
                          spec:
                            description: Spec is the specification of the desired
                              behavior of the machine template.
                            minProperties: 1
                            properties:
                              deletion:
                                description: Deletion contains configuration options
                                  for Machine deletion.
                                minProperties: 1
                                properties:
                                  nodeDeletionTimeoutSeconds:
                                    description: |-
                                      NodeDeletionTimeoutSeconds defines, in seconds, how long the controller will attempt to
                                      delete the Node that is hosted by a Machine after the Machine is marked for deletion. A
                                      duration of 0 will retry deletion indefinitely. Defaults to 10 seconds when omitted.
                                    format: int32
                                    minimum: 0
                                    type: integer
                                  nodeDrainTimeoutSeconds:
                                    description: |-
                                      NodeDrainTimeoutSeconds is the total amount of time, in seconds, that the controller will
                                      spend draining a control plane node. The default value is 0, meaning that the node can be
                                      drained without any time limitations.
                                      NOTE: NodeDrainTimeoutSeconds is different from `kubectl drain --timeout`.
                                    format: int32
                                    minimum: 0
                                    type: integer
                                  nodeVolumeDetachTimeoutSeconds:
                                    description: |-
                                      NodeVolumeDetachTimeoutSeconds is the total amount of time, in seconds, that the controller
                                      will spend waiting for all volumes to be detached. The default value is 0, meaning that the
                                      volumes can be detached without any time limitations.
                                    format: int32
                                    minimum: 0
                                    type: integer
                                type: object
                            type: object
                        type: object
                      remediation:
                        description: remediation controls how unhealthy control plane
                          Machines are remediated.
                        properties:
                          maxRetry:
                            description: "maxRetry is the maximum number of retries
                              while attempting to remediate an unhealthy machine.\nA
                              retry happens when a machine that was created as a replacement
                              for an unhealthy machine also fails.\nFor example, given
                              a control plane with three machines M1, M2, M3:\n\n\tM1
                              become unhealthy; remediation happens, and M1-1 is created
                              as a replacement.\n\tIf M1-1 (replacement of M1) has
                              problems while bootstrapping it will become unhealthy,
                              and then be\n\tremediated; such operation is considered
                              a retry, remediation-retry #1.\n\tIf M1-2 (replacement
                              of M1-1) becomes unhealthy, remediation-retry #2 will
                              happen, etc.\n\nA retry could happen only after retryPeriodSeconds
                              from the previous retry.\nIf a machine is marked as
                              unhealthy after minHealthyPeriodSeconds from the previous
                              remediation expired,\nthis is not considered a retry
                              anymore because the new issue is assumed unrelated from
                              the previous one.\n\nDefaults to 3, so that a machine
                              that keeps failing for the same reason, a quota or an
                              image\nproblem say, is not replaced forever."
                            format: int32
                            minimum: 0
                            type: integer
                          minHealthyPeriodSeconds:
                            description: "minHealthyPeriodSeconds defines the duration,
                              in seconds, after which the TalosControlPlane\nconsiders
                              any failure of a machine unrelated to the previous one.
                              In this case the remediation\nis not considered a retry
                              anymore, and thus the retry counter restarts from 0.
                              For example,\nassuming minHealthyPeriodSeconds is set
                              to 1h (default)\n\n\tM1 become unhealthy; remediation
                              happens, and M1-1 is created as a replacement.\n\tIf
                              M1-1 (replacement of M1) has problems within the 1hr
                              after the creation, also\n\tthis machine will be remediated
                              and this operation is considered a retry - a problem
                              related\n\tto the original issue happened to M1 -.\n\n\tIf
                              instead the problem on M1-1 is happening after minHealthyPeriodSeconds
                              expired, e.g. four days after\n\tm1-1 has been created
                              as a remediation of M1, the problem on M1-1 is considered
                              unrelated to\n\tthe original issue happened to M1.\n\nDefaults
                              to 3600."
                            format: int32
                            minimum: 0
                            type: integer
                          retryPeriodSeconds:
                            description: |-
                              retryPeriodSeconds is the duration, in seconds, that the TalosControlPlane waits before
                              remediating a machine being created as a replacement for an unhealthy machine (a retry).

                              Defaults to 300.
                            format: int32
                            minimum: 0
                            type: integer
                        type: object
                      rolloutStrategy:
                        default:
                          rollingUpdate:
                            maxSurge: 1
                          type: RollingUpdate
                        description: |-
                          The RolloutStrategy to use to replace control plane machines with
                          new ones.
                        properties:
                          rollingUpdate:
                            description: |-
                              Rolling update config params. Present only if
                              RolloutStrategyType = RollingUpdate.
                            properties:
                              maxSurge:
                                anyOf:
                                - type: integer
                                - type: string
                                description: |-
                                  The maximum number of control planes that can be scheduled above or under the
                                  desired number of control planes.
                                  Value can be an absolute number 1 or 0.
                                  Defaults to 1.
                                  Example: when this is set to 1, the control plane can be scaled
                                  up immediately when the rolling update starts.
                                x-kubernetes-int-or-string: true
                            type: object
                          type:
                            description: |-
                              Change rollout strategy.

                              Supported strategies:
                               * "RollingUpdate".
                               * "OnDelete"

                              Default is RollingUpdate.
                            type: string
                        type: object
                    required:
                    - controlPlaneConfig
                    type: object
                required:
                - spec
                type: object
            required:
            - template
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
