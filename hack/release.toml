project_name = "CAPI Control Plane Provider Talos"
github_repo = "talos-systems/cluster-api-control-plane-provider-talos"
match_deps = "^github.com/(talos-systems/[a-zA-Z0-9-]+)$"

# previous release
previous = "v0.8.0"

pre_release = false

preface = """\
"""

[notes]

[notes.lifecycle]
    title = "Machine lifecycle"
        description = """\
Control plane Machine deletion now follows the Kubeadm Control Plane provider end to end.
Scale-down only deletes the Machine: the etcd member leaves at the pre-terminate phase and the
core Machine controller deletes the Node, so the provider no longer removes members inline or
deletes workload Node objects. Scale-up and scale-down run KCP-style preflight checks first
(no deletion in flight, every machine with a Node, components and etcd healthy; the scale-down
victim is exempt) and report `ControlPlaneUnhealthy` events while they wait. The pre-terminate
hook refuses to remove a member when the remaining healthy members would fall below quorum,
holding the deletion with an `EtcdQuorumAtRisk` event instead of failing open. Deleting
machines are excluded from the control plane health checks.
"""

[notes.flags]
    title = "Flags"
        description = """\
`--enable-machine-pre-terminate-hook` is removed: the hook is always on, as in KCP, and the
legacy inline etcd-leave path it guarded is gone. `--etcd-cleanup-timeout` is unchanged.
"""
