# commit to be tagged for new release
commit = "HEAD"

project_name = "CAPI Control Plane Provider Talos"
github_repo = "sidero-community/cluster-api-control-plane-provider-talos"
match_deps = "^github.com/(talos-systems/[a-zA-Z0-9-]+)$"

# The bootstrap provider is consumed through a replace directive that points at the fork, whose
# module name differs from the require line's; the release tool cannot pair the two, would report
# the stale require version, and resolves that version against the upstream repository. The
# version in use is stated in the dependency notes instead.
ignore_deps = ["github.com/siderolabs/cluster-api-bootstrap-provider-talos"]

# previous release
previous = "v0.11.0"

pre_release = false

preface = """\
"""

[notes]

[notes.a-rotated-infra]
    title = "In-place updates after an infrastructure template rotation"
        description = """\
A control plane machine whose InfraMachine was cloned from a superseded infrastructure template
is now offered to the in-place update extension instead of always being replaced. Its
InfraMachine is rebuilt from the current template, keeping the fields the infrastructure provider
set on the machine: the contract's `spec.providerID` and, per kind, a known list (TinkerbellMachine:
`spec.hardwareName`). For other kinds a rotated template still means a replacement. The extension
decides as for any other change; with the bootstrap provider v0.10.2, a TinkerbellMachine change
to `tasks`, `templateInline`, `templateRef`, `hardwareAffinity` or `bootOptions` is absorbed and
the machine is not re-imaged. The rebuilt InfraMachine is written with a merge patch, so the old
template's fields are removed even when an earlier create still co-owns them, and its cloned-from
annotations are re-stamped.
"""

[notes.b-uptodate]
    title = "UpToDate condition message"
        description = """\
The `UpToDate` condition of an outdated control plane machine says which check it fails: its
Kubernetes version, its InfraMachine (with the template it was cloned from and the one
required), or its TalosConfig.
"""

[notes.c-deps]
    title = "Dependencies"
        description = """\
No dependency updates.
"""
