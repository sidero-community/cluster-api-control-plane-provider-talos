pre_release = false

preface = """\
"""

[notes]

[notes.failuredomains]
    title = "Failure Domain Spreading"
        description = """\
Control plane machines now stay spread across failure domains during a rollout, not only when
the cluster is first created. A new machine goes to the domain holding the fewest up-to-date
machines, ties are broken by the fewest machines overall, and scaling down removes a machine
from the domain holding the most, so a rolling update no longer drains a domain.

The failure domain chosen for each machine is logged along with the domains that were eligible.
"""

[notes.etcd]
    title = "etcd health check"
        description = """\
The etcd health check inspects the control plane machines concurrently, each with its own
timeout, and verifies etcd membership instead of counting members: every machine must have a
member, matched by its node name or any `MachineHostName` address, a member matching no machine
is an orphan, and a machine without a node yet claims one unmatched member. The
`EtcdClusterHealthy` condition reports `EtcdClusterQuorumLost` when too few members are healthy
for quorum and `EtcdClusterInspectionFailed` when too few machines could be inspected to tell,
instead of `EtcdClusterUnhealthy` for every failure. The pre-terminate hook matches the leaving
member by the same names.
"""

[notes.remediation]
    title = "MachineHealthCheck remediation"
        description = """\
Control plane Machines that a MachineHealthCheck hands to the control plane are now remediated, as
KCP does: one at a time, only while removing the etcd member keeps quorum, and within the retry
limits of the new `spec.remediation` block (`maxRetry`, `retryPeriodSeconds`,
`minHealthyPeriodSeconds`), which default to 3 retries, 5 minutes apart, for replacements that
fail within an hour. Remediation deletes the Machine and nothing else; the pre-terminate hook
removes the etcd member and the regular scale-up creates the replacement, through a narrower
preflight check while the remediation is in progress so that a control plane with more than one
failure recovers one machine at a time. The quorum check reads the etcd statuses recorded by the
health check of the same reconcile instead of probing etcd again. Remediation waits for a version
upgrade pending from the cluster topology and for in-place updates; before the control plane is
initialized it replaces a machine while nothing was bootstrapped, or a machine that never joined
when another machine holds the bootstrapped etcd data.

Why a machine waits is reported on its `OwnerRemediated` condition (`RemediationDeferred`,
`CannotBeRemediated`), the latter also as a `CannotRemediateMachine` warning event on the
TalosControlPlane; a remediated machine gets a `RemediatingMachine` event. The TalosControlPlane
gains a `Remediating` condition and `status.lastRemediation`, as the KubeadmControlPlane has.

The pre-terminate hook now identifies the etcd member of a machine that never registered a node
by elimination, and releases the deletion right away instead of after the fail-open deadline when
the member cannot be told apart; the quorum safeguard probes the remaining machines concurrently.
"""

[notes.deps]
    title = "Dependencies"
        description = """\
