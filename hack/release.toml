# commit to be tagged for new release
commit = "HEAD"

project_name = "CAPI Control Plane Provider Talos"
github_repo = "talos-systems/cluster-api-control-plane-provider-talos"
match_deps = "^github.com/(talos-systems/[a-zA-Z0-9-]+)$"

# previous release
previous = "v0.7.1"

pre_release = false

preface = """\
"""

[notes]

[notes.capi]
    title = "Cluster API"
        description = """\
CACPPT is now built against CAPI v1.14 (v1beta2 contract, unchanged), which adds
Kubernetes 1.37 for management and workload clusters. Kubernetes 1.37 workload
clusters need CAPI core v1.14.1 or later on the management cluster.
"""

[notes.api]
    title = "API"
        description = """\
`spec.controlPlaneConfig.init` and the init-node bootstrap path are removed; clusters have
bootstrapped through the Cluster API Bootstrap call since v0.4.0. `status.deprecated.v1beta1`
is removed; only the v1beta2 conditions, initialization and replica counters remain. v1alpha3
clients see the legacy fields derived from them.
"""

[notes.talos]
    title = "Talos Linux"
        description = """\
CACPPT updated for Talos 1.14: built against machinery v1.14.0 and tested with Talos v1.14.0.
"""
